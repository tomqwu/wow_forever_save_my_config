name: Check and release
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: check-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: python3 scripts/check.py
      - run: git diff --check
      - run: python3 scripts/package.py
      - name: Require an unreleased version before merge
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_guard.py --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverSaveMyConfig
          path: dist/*.zip
  windows-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test offline tools with synthetic data
        shell: powershell
        run: ./tests/test_powershell.ps1
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, windows-tools]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python3 scripts/release_guard.py --repository "$GITHUB_REPOSITORY")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 scripts/release_notes.py "$tag" > /tmp/release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: ForeverSaveMyConfig
          path: dist
      - name: Publish tested package from this main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Forever - Save My Config ${RELEASE_TAG#ForeverSaveMyConfig-}" \
            --notes-file /tmp/release-notes.md
  curseforge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CURSEFORGE_PROJECT_ID != '' && vars.CURSEFORGE_PUBLISH_ENABLED == 'true'
    needs: release
    uses: ./.github/workflows/curseforge.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      CURSE_FORGE: ${{ secrets.CURSE_FORGE }}
    permissions:
      contents: write
